<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopFlow - Administradores</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav class="navbar navbar-admin">
        <h1>🔐 ShopFlow Admin</h1>
        <div class="nav-links">
            <a href="/admin/dashboard">Dashboard</a>
            <a href="/admin/logout">Sair</a>
        </div>
    </nav>

    <div class="dashboard-container">
        <div class="page-header">
            <h2>👤 Administradores</h2>
            <a href="/admin/admins/novo" class="btn-primary">+ Novo Admin</a>
        </div>

        <table class="tabela">
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Email</th>
                    <th>Nível</th>
                </tr>
            </thead>
            <tbody>
                {% for admin in admins %}
                <tr>
                    <td>{{ admin.get_nome() }}</td>
                    <td>{{ admin.get_email() }}</td>
                    <td><span class="badge">{{ admin.get_nivel() }}</span></td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
